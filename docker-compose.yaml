# fișier de orchestrare pentru cloud-based sound fx
services:
  # motorul de procesare audio (backend)
  audio-engine:
    build: ./audio-engine
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://database:27017
      - S3_ENDPOINT=http://storage:9000
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=password123
    depends_on:
      - database
      - storage

  # persistenta preset-urilor (nosql)
  database:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # stocare obiecte (s3-compatible) pentru wav-uri
  storage:
    image: minio/minio:latest
    ports:
      - "9000:9000" # api-ul s3
      - "9001:9001" # consola web minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  mongo_data:
  minio_data: