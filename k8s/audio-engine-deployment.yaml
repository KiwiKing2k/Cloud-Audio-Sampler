apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audio-engine
  template:
    metadata:
      labels:
        app: audio-engine
    spec:
      containers:
        - name: audio-engine
          image: cloud-sampler-audio-engine:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: MONGO_URL
              value: "mongodb://database-service:27017"
            - name: S3_ENDPOINT
              value: "http://storage-service:9000"
            - name: S3_ACCESS_KEY
              value: "admin"
            - name: S3_SECRET_KEY
              value: "password123"